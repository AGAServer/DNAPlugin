    <!-- SCRIPT TỰ ĐỘNG LẤY PHIÊN BẢN APK TỪ GITHUB -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const versionSpan = document.getElementById('apk-version');
            if (versionSpan) {
                fetch('https://api.github.com/repos/AGAServer/DNAPlugin/releases/latest')
                    .then(response => response.json())
                    .then(data => {
                        if (data.tag_name) {
                            versionSpan.textContent = 'Phiên bản ' + data.tag_name;
                        } else {
                            versionSpan.textContent = 'Bản mới nhất';
                        }
                    })
                    .catch(error => {
                        versionSpan.textContent = 'Bản mới nhất';
                    });
            }
        });
    </script>

    <!-- Khối Javascript điều khiển tính năng tự động cuộn (Auto-Slide) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // Hàm thiết lập tự động trượt cho từng khung
            function setupAutoSlide(sliderId, isVertical, intervalTime) {
                const slider = document.getElementById(sliderId);
                if (!slider) return;
                
                let currentIndex = 0;
                const items = slider.querySelectorAll('.snap-item');
                const itemCount = items.length;
                let isHovered = false;

                // Tạm dừng khi người dùng thao tác (hover bằng chuột hoặc vuốt cảm ứng)
                slider.addEventListener('mouseenter', () => isHovered = true);
                slider.addEventListener('mouseleave', () => isHovered = false);
                slider.addEventListener('touchstart', () => isHovered = true, {passive: true});
                slider.addEventListener('touchend', () => isHovered = false, {passive: true});

                // Vòng lặp chuyển ảnh
                setInterval(() => {
                    if (isHovered) return; // Nếu đang tương tác thì không tự cuộn
                    
                    currentIndex++;
                    
                    // Nếu đã chạy đến ảnh cuối cùng, quay lại ảnh đầu tiên
                    if (currentIndex >= itemCount) {
                        currentIndex = 0;
                    }
                    
                    if (isVertical) {
                        // Cuộn dọc cho Mobile
                        slider.scrollTo({
                            top: currentIndex * slider.clientHeight,
                            behavior: 'smooth'
                        });
                    } else {
                        // Cuộn ngang cho Desktop
                        slider.scrollTo({
                            left: currentIndex * slider.clientWidth,
                            behavior: 'smooth'
                        });
                    }
                }, intervalTime);
            }

            // Khởi chạy: Điện thoại chuyển ảnh sau 3 giây, Máy tính chuyển sau 4 giây
            setupAutoSlide('mobile-slider', true, 3000);
            setupAutoSlide('pc-slider', false, 4000);
        });
    </script>
