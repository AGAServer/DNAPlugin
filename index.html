<style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; scroll-behavior: smooth; background-color: #0b111e; }
        
        /* Hiệu ứng kính mờ cho các nút chú dẫn */
        .glass-legend { 
            background: rgba(15, 56, 35, 0.6); 
            backdrop-filter: blur(8px);
            border: 1px solid rgba(52, 211, 153, 0.3);
            transition: all 0.3s ease;
        }
        .glass-legend.active {
            background: rgba(16, 185, 129, 0.9);
            border-color: #FACC15;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.5);
            transform: scale(1.05);
        }

        /* Nền GIS / Viễn thám mô phỏng không gian số */
        .gis-background {
            background-color: #081b12;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.15) 0%, transparent 60%),
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            background-position: center center;
        }

        /* Hiệu ứng phảng sáng cho Logo */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 8px rgba(52, 211, 153, 0.4); }
            50% { box-shadow: 0 0 20px rgba(52, 211, 153, 0.8); }
        }
        .logo-glow { animation: pulse-glow 3s infinite; border-radius: 8px; }

        /* Hiệu ứng phảng sáng dưới nền điện thoại */
        .phone-glow {
            box-shadow: 0 20px 70px 20px rgba(16, 185, 129, 0.3), 
                        inset 0 0 20px rgba(0,0,0,0.8);
        }

        /* Chuyển cảnh mượt mà cho ảnh trong màn hình */
        .screen-image {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }
        .screen-image.active { opacity: 1; z-index: 10; }

        /* CSS Marquee giữ nguyên */
        @keyframes marquee { 0% { transform: translateX(0%); } 100% { transform: translateX(-100%); } }
        .animate-marquee { animation: marquee 20s linear infinite; display: inline-flex; }
    </style>
