<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DNAPlugin - 3D Tracklog Simulation</title>
    <link rel="icon" type="image/png" href="DNAPlugin.png">
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="cesiumContainer"></div>

    <div id="watermark">
        <img src="assets/DNAPlugin.png" alt="DNAPlugin Logo" id="wm-logo">
        <div id="wm-text">
            <strong>DNAPlugin</strong><br>
            <span>dnaplugin.id.vn</span>
        </div>
    </div>

    <!-- Màn hình thông báo đang render video -->
    <div id="recordingOverlay" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; color:white; display:flex; flex-direction:column; justify-content:center; align-items:center;">
        <h2 style="color:#FACC15; margin-bottom:10px;">🎥 ĐANG DỰNG VIDEO 3D...</h2>
        <p>Vui lòng không tắt hoặc thu nhỏ ứng dụng.</p>
        <div id="progressText" style="font-weight:bold; font-size:24px; margin-top:20px;">0%</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
